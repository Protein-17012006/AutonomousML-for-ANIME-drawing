AWSTemplateFormatVersion: '2010-09-09'
Description: copilot Cognito pool, legacy ALB client, public SPA client, and staged Google OAuth secret

Parameters:
  AppDomain:
    Type: String
    Description: Public app host, e.g. copilot.example.click
  HostedUiPrefix:
    Type: String
    Default: copilot-g4-auth
    Description: Globally-unique Cognito hosted-UI domain prefix
  EnableGoogleOAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable Google only after the retained secret contains real credentials
  GoogleOAuthSecretVersionId:
    Type: String
    Default: PENDING
    NoEcho: true
    Description: Secret version containing client_id and client_secret; required when Google is enabled

Conditions:
  GoogleOAuthEnabled: !Equals [!Ref EnableGoogleOAuth, 'true']

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: copilot-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      UserPoolTags:
        project: copilot

  # Retained during the transition because the current ALB listener still uses it.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: copilot-alb
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub https://${AppDomain}/oauth2/idpresponse
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  GoogleOAuthCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: /copilot/google-oauth
      Description: Google OAuth web-client credentials used by Cognito
      GenerateSecretString:
        SecretStringTemplate: '{"client_id":"PENDING"}'
        GenerateStringKey: client_secret
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: project
          Value: copilot

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleOAuthEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        authorize_scopes: openid email profile
        client_id: !Sub '{{resolve:secretsmanager:/copilot/google-oauth:SecretString:client_id::${GoogleOAuthSecretVersionId}}}'
        client_secret: !Sub '{{resolve:secretsmanager:/copilot/google-oauth:SecretString:client_secret::${GoogleOAuthSecretVersionId}}}'
      AttributeMapping:
        email: email
        name: name
        picture: picture

  SpaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: copilot-spa
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: !If
        - GoogleOAuthEnabled
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      CallbackURLs:
        - http://localhost:3000/sso-callback
        - !Sub https://${AppDomain}/sso-callback
      LogoutURLs:
        - http://localhost:3000/login
        - !Sub https://${AppDomain}/login
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref HostedUiPrefix
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: {Name: copilot-UserPoolArn}
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export: {Name: copilot-UserPoolClientId}
  SpaUserPoolClientId:
    Value: !Ref SpaUserPoolClient
    Export: {Name: copilot-SpaUserPoolClientId}
  UserPoolDomainPrefix:
    Value: !Ref HostedUiPrefix
    Export: {Name: copilot-UserPoolDomain}
  GoogleOAuthSecretArn:
    Value: !Ref GoogleOAuthCredentials
  GoogleOAuthSecretName:
    Value: /copilot/google-oauth
