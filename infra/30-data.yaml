AWSTemplateFormatVersion: '2010-09-09'
Description: copilot front door - artifacts/deploy buckets, sessions table, box-publisher IAM

Parameters:
  BucketPrefix:
    Type: String
    Default: copilot-g4

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-artifacts
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{Key: project, Value: copilot}]

  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-deploy
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{Key: project, Value: copilot}]

  SessionsTable:
    Type: AWS::DynamoDB::Table
    # Only non-reproducible data AWS holds; teardown must not silently destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: copilot_sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pid, AttributeType: S}]
      KeySchema: [{AttributeName: pid, KeyType: HASH}]
      Tags: [{Key: project, Value: copilot}]

  PublisherUser:
    Type: AWS::IAM::User
    Properties:
      UserName: copilot-box-publisher
      Policies:
        - PolicyName: publish-only          # design §3: Put-only, no Get/List/Delete
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt SessionsTable.Arn
      Tags: [{Key: project, Value: copilot}]

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export: {Name: copilot-ArtifactsBucket}
  DeployBucketName:
    Value: !Ref DeployBucket
    Export: {Name: copilot-DeployBucket}
  SessionsTableName:
    Value: !Ref SessionsTable
    Export: {Name: copilot-SessionsTable}
