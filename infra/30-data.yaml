AWSTemplateFormatVersion: '2010-09-09'
Description: copilot front door - artifacts/deploy buckets, sessions table, box-publisher IAM

Parameters:
  BucketPrefix:
    Type: String
    Default: copilot-g4

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-artifacts
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{Key: project, Value: copilot}]

  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-deploy
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{Key: project, Value: copilot}]

  SessionsTable:
    Type: AWS::DynamoDB::Table
    # Only non-reproducible data AWS holds; teardown must not silently destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: copilot_sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pid, AttributeType: S}
        - {AttributeName: owner_sub, AttributeType: S}
        - {AttributeName: owner_sort, AttributeType: S}
      KeySchema: [{AttributeName: pid, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: OwnerSessionsIndex
          KeySchema:
            - {AttributeName: owner_sub, KeyType: HASH}
            - {AttributeName: owner_sort, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - ts
              - n_pairs
              - n_autopass
              - n_corrected
              - flagged
              - abstained
              - needs_key
              - artifact_keys
      Tags: [{Key: project, Value: copilot}]

  MemoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: copilot_memories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userPk, AttributeType: S}
        - {AttributeName: memorySk, AttributeType: S}
      KeySchema:
        - {AttributeName: userPk, KeyType: HASH}
        - {AttributeName: memorySk, KeyType: RANGE}
      Tags: [{Key: project, Value: copilot}]

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: copilot_feedback
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: sessionPk, AttributeType: S}
        - {AttributeName: feedbackSk, AttributeType: S}
      KeySchema:
        - {AttributeName: sessionPk, KeyType: HASH}
        - {AttributeName: feedbackSk, KeyType: RANGE}
      Tags: [{Key: project, Value: copilot}]

  PublisherUser:
    Type: AWS::IAM::User
    Properties:
      UserName: copilot-box-publisher
      Policies:
        - PolicyName: session-api-and-publish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${ArtifactsBucket.Arn}/artifacts/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt SessionsTable.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${SessionsTable.Arn}/index/OwnerSessionsIndex
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MemoryTable.Arn
                  - !GetAtt FeedbackTable.Arn
      Tags: [{Key: project, Value: copilot}]

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export: {Name: copilot-ArtifactsBucket}
  DeployBucketName:
    Value: !Ref DeployBucket
    Export: {Name: copilot-DeployBucket}
  SessionsTableName:
    Value: !Ref SessionsTable
    Export: {Name: copilot-SessionsTable}
  MemoryTableName:
    Value: !Ref MemoryTable
    Export: {Name: copilot-MemoryTable}
  FeedbackTableName:
    Value: !Ref FeedbackTable
    Export: {Name: copilot-FeedbackTable}
